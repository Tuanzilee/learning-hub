<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="description" content="近期使用的課程複習網站與學習工具。">
  <title>我的學習入口</title>
  <style>
    :root { color-scheme: light; --paper:#f6f3ec; --ink:#343c32; --muted:#72776b; --line:#dfe1d5; --green:#4e6345; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif; }
    main { max-width:940px; margin:auto; padding:72px 30px 36px; }
    .eyebrow { display:flex; align-items:center; gap:9px; color:var(--green); font-size:12px; letter-spacing:2px; }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--green); }
    header { margin-bottom:48px; }
    h1 { margin:18px 0 12px; font-size:clamp(32px,6vw,48px); letter-spacing:-1px; font-weight:650; line-height:1.25; }
    header p { margin:0; color:var(--muted); font-size:16px; line-height:1.8; }
    .section-label { display:flex; align-items:center; gap:14px; margin:30px 0 16px; }
    h2 { font-size:13px; margin:0; letter-spacing:1px; font-weight:600; white-space:nowrap; }
    .section-label:after { content:""; height:1px; background:var(--line); flex:1; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .card { display:flex; align-items:center; gap:18px; padding:25px 22px; min-height:114px; border:1px solid var(--line); border-radius:18px; color:inherit; text-decoration:none; background:#fffdf8; transition:transform .18s,border-color .18s,background .18s; }
    .card:hover { transform:translateY(-3px); border-color:#a3b29a; background:#fff; }
    .card:focus-visible { outline:3px solid var(--green); outline-offset:4px; }
    .icon { flex-shrink:0; display:grid; place-items:center; width:48px; height:48px; border-radius:14px; background:#eaf0e5; color:var(--green); }
    .icon.warm { background:#f3eadd; color:#956c42; }
    .icon.blue { background:#e7edf0; color:#56727e; }
    .icon.rose { background:#f2e6e1; color:#956556; }
    svg { width:25px; height:25px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
    .copy { flex:1; min-width:0; }
    h3 { margin:0 0 6px; font-size:18px; font-weight:600; }
    .copy p { margin:0; color:var(--muted); font-size:13px; line-height:1.6; }
    .arrow { font-size:22px; color:#92998a; }
    footer { border-top:1px solid var(--line); margin-top:44px; padding-top:20px; color:var(--muted); font-size:12px; display:flex; justify-content:space-between; gap:18px; }
    .progress { margin-top:40px; }
    .progress-heading { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
    .progress-heading h2 { font-size:20px; letter-spacing:0; }
    .update-time { color:var(--muted); font-size:12px; }
    .progress-columns { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
    .progress-panel { padding:22px; background:#fffdf8; border:1px solid var(--line); border-radius:18px; }
    .progress-panel h3 { font-size:14px; margin-bottom:18px; color:var(--green); }
    .progress-list { list-style:none; padding:0; margin:0; }
    .progress-list li { padding:14px 0; border-top:1px solid var(--line); }
    .progress-list li:first-child { border-top:0; padding-top:0; }
    .row-top { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
    .row-top strong { font-size:14px; font-weight:600; }
    .row-top span { color:var(--muted); font-size:12px; white-space:nowrap; }
    .progress-list p { margin:6px 0 0; font-size:14px; line-height:1.7; }
    .progress-list small { display:block; color:var(--muted); font-size:12px; margin-top:5px; line-height:1.6; }
    .countdown { color:#9a593a !important; }
    .progress-note { color:var(--muted); font-size:12px; line-height:1.7; margin:14px 0 0; }
    details { margin-top:10px; font-size:13px; }
    summary { cursor:pointer; color:var(--green); padding:8px 0; }
    @media (max-width:700px) { .progress-columns { grid-template-columns:1fr; gap:14px; } .progress-panel { padding:20px; } }
    @media (max-width:600px) { main { padding:38px 20px 28px; } header { margin-bottom:34px; } .grid { grid-template-columns:1fr; gap:12px; } .card { min-height:96px; padding:20px 18px; gap:15px; } h3 { font-size:17px; } footer { margin-top:32px; } }
    @media (prefers-reduced-motion:reduce) { .card { transition:none; } .card:hover { transform:none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow"><span class="dot" aria-hidden="true"></span>LEARNING SPACE</div>
      <h1>我的學習入口</h1>
    </header>
    <section aria-labelledby="review-title">
      <div class="section-label"><h2 id="review-title">課程複習</h2></div>
      <div class="grid">
        <a class="card" href="https://tuanzilee.github.io/german-review/">
          <span class="icon warm" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h16v12H9l-5 4V5Z"/><path d="m9 13 3-6 3 6M10 11h4"/></svg></span>
          <span class="copy"><h3>德文複習</h3><p>用基礎德文介紹自己、家人與飲食，練習日常溝通。</p></span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="card" href="https://tuanzilee.github.io/exp-methods-review/">
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-6 10a1 1 0 0 0 1 2h14a1 1 0 0 0 1-2L14 9V3M8 15h8"/></svg></span>
          <span class="copy"><h3>心理學實驗法</h3><p>設計心理學研究，判斷證據品質與因果主張。</p></span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="card" href="https://tuanzilee.github.io/psychtest-review/">
          <span class="icon blue" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 4H5v17h14V4h-4M9 3h6v4H9zM8 12l1 1 2-2M13 12h3M8 17l1 1 2-2M13 17h3"/></svg></span>
          <span class="copy"><h3>心理測驗</h3><p>理解心理特質如何測量，判斷測驗的信度與效度。</p></span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="card" href="https://tuanzilee.github.io/cogneuro-review/">
          <span class="icon rose" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5c-3-5-7-1-6 2-4 0-5 6-2 8-1 5 5 7 8 3V5ZM12 5c3-5 7-1 6 2 4 0 5 6 2 8 1 5-5 7-8 3M7 9l2 2M5 15h4M17 9l-2 2M19 15h-4"/></svg></span>
          <span class="copy"><h3>認知神經科學</h3><p>理解大腦如何支持知覺、注意、記憶與語言。</p></span><span class="arrow" aria-hidden="true">↗</span>
        </a>
      </div>
    </section>
    <section aria-labelledby="tools-title">
      <div class="section-label"><h2 id="tools-title">學習工具與報告</h2></div>
      <div class="grid">
        <a class="card" href="https://tuanzilee.github.io/course-plan/">
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20h16M6 16V9M12 16V4M18 16v-5"/></svg></span>
          <span class="copy"><h3>畢業學分儀表板</h3><p>掌握畢業學分缺口，安排修課與學習進度。</p></span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="card" href="https://tuanzilee.github.io/sociology-interactive-report/">
          <span class="icon warm" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 4c4-1 6 0 9 2 3-2 5-3 9-2v15c-4-1-6 0-9 2-3-2-5-3-9-2V4ZM12 6v15M6 8l3 1M15 9l3-1"/></svg></span>
          <span class="copy"><h3>社會學報告</h3><p>用社會學視角理解個人經驗與制度、文化的關係。</p></span><span class="arrow" aria-hidden="true">↗</span>
        </a>
      </div>
    </section>
    <section class="progress" aria-labelledby="progress-title">
      <div class="progress-heading"><h2 id="progress-title">課程與考試進度</h2><span class="update-time" id="update-time">載入中</span></div>
      <div class="progress-columns">
        <div class="progress-panel"><h3 id="week-label">本週課程</h3><ul class="progress-list" id="course-progress"></ul></div>
        <div class="progress-panel"><h3>接下來的考試與作業</h3><ul class="progress-list" id="upcoming-events"></ul><details id="more-events" hidden><summary>查看後續日期</summary><ul class="progress-list" id="later-events"></ul></details></div>
      </div>
      <p class="progress-note" id="progress-note"></p>
    </section>
  </main>
  <script src="progress.js"></script>
</body>
</html>
